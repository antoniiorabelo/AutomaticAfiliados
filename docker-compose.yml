
services:
  db:
    image: postgres:15
    container_name: bot_ofertas_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: COLOQUE_SUA_SENHA_DO_BANCO_AQUI
      POSTGRES_DB: ofertas_db
    ports:
      - "5433:5432"
    volumes:
      - automaticafiliados_pgdata:/var/lib/postgresql/data

  # ... (deixe a configuração do seu n8n e outras coisas que estiverem abaixo intactas)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: bot_ofertas_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - db

# ... (aqui em cima estão as configurações do seu banco e do n8n)

volumes:
  automaticafiliados_pgdata:
  n8n_data:
